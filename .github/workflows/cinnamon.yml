name: RICH LINUX (Cinnamon + Chrome Remote Desktop)

on:
  workflow_dispatch:
    inputs:
      crd_host_command:
        description: "Paste SELURUH command Chrome Remote Desktop dari halaman Remote Access"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ============================================================
      # PREPARE SYSTEM
      # ============================================================
      - name: Prepare System
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 01/14] PREPARE SYSTEM${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Updating package lists...${C_NC}"
          sudo apt-get update

          echo -e "${C_YELLOW}[INFO] Enabling universe repository (needed for Cinnamon)...${C_NC}"
          sudo add-apt-repository -y universe || true
          sudo apt-get update

          echo -e "${C_YELLOW}[INFO] Removing unnecessary packages...${C_NC}"
          sudo apt-get remove -y --purge \
            man-db \
            firewalld \
            ufw \
            || true

          sudo apt-get autoremove -y || true

          echo -e "${C_GREEN}[OK] System prepared.${C_NC}"


      # ============================================================
      # INSTALL CINNAMON DESKTOP (FULL)
      # ============================================================
      - name: Install Cinnamon Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 02/14] INSTALL CINNAMON DESKTOP (FULL)${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Installing full Cinnamon desktop environment...${C_NC}"
          echo -e "${C_YELLOW}[INFO] This downloads approx 1GB, please wait...${C_NC}"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cinnamon-desktop-environment \
            cinnamon \
            cinnamon-session \
            dbus-x11 \
            dbus-user-session \
            policykit-1 \
            x11-xserver-utils \
            xorg \
            xserver-xorg-video-dummy \
            mesa-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            adwaita-icon-theme \
            fonts-cantarell \
            nemo \
            gnome-terminal

          echo "------------------------------------------------------------"
          echo -e "${C_YELLOW}[INFO] Verifying Cinnamon binaries (fail-fast)...${C_NC}"
          command -v cinnamon || { echo -e "${C_RED}[FAIL] binary 'cinnamon' not found after install.${C_NC}"; exit 1; }
          test -x /usr/bin/cinnamon-session || { echo -e "${C_RED}[FAIL] /usr/bin/cinnamon-session not found.${C_NC}"; exit 1; }
          cinnamon --version
          muffin --version || true
          nemo --version || true
          ls /usr/share/xsessions/cinnamon.desktop || true
          grep "^Exec=" /usr/share/xsessions/cinnamon.desktop || true
          which cinnamon-session || true
          ls /usr/share/cinnamon-session/sessions/ || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] Cinnamon desktop installed: $(cinnamon --version 2>/dev/null || echo 'version check skipped')${C_NC}"


      # ============================================================
      # CREATE REMOTE USER
      # ============================================================
      - name: Setup Remote User
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 03/14] SETUP REMOTE USER${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Creating user 'runner'...${C_NC}"
          sudo useradd \
            -m \
            -s /bin/bash \
            runner || true

          echo "runner:Antigravity2026!" | sudo chpasswd

          sudo usermod -aG sudo runner

          sudo mkdir -p /home/runner/Desktop

          sudo chown -R runner:runner /home/runner

          echo -e "${C_GREEN}[OK] Remote user 'runner' created: $(id runner)${C_NC}"


      # ============================================================
      # INSTALL GOOGLE CHROME
      # ============================================================
      - name: Install Google Chrome
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 04/14] INSTALL GOOGLE CHROME${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Downloading Google Chrome stable...${C_NC}"
          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O /tmp/google-chrome.deb

          echo -e "${C_YELLOW}[INFO] Installing .deb package...${C_NC}"
          sudo apt-get install -y /tmp/google-chrome.deb

          rm -f /tmp/google-chrome.deb

          echo -e "${C_GREEN}[OK] Google Chrome installed: $(google-chrome --version)${C_NC}"


      # ============================================================
      # INSTALL VS CODE
      # ============================================================
      - name: Install VS Code
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 05/14] INSTALL VS CODE${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Adding Microsoft repository...${C_NC}"
          wget -qO- \
            https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/packages.microsoft.gpg > /dev/null

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
            | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null

          sudo apt-get update

          echo -e "${C_YELLOW}[INFO] Installing VS Code...${C_NC}"
          sudo apt-get install -y code

          echo -e "${C_GREEN}[OK] VS Code installed: $(code --version | head -n 1)${C_NC}"


      # ============================================================
      # INSTALL OPENCODE CLI
      # ============================================================
      - name: Install OpenCode CLI
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 06/14] INSTALL OPENCODE CLI${C_NC}"
          echo "------------------------------------------------------------"

          sudo apt-get update

          sudo apt-get install -y curl

          # NOTE: installer opencode.ai/install mengabaikan
          # OPENCODE_INSTALL_DIR dan selalu install ke $HOME/.opencode/bin.
          # $GITHUB_PATH dari installer hanya berlaku untuk step berikutnya,
          # jadi export PATH manual untuk step yang sama.
          echo -e "${C_YELLOW}[INFO] Running official OpenCode installer...${C_NC}"
          curl -fsSL https://opencode.ai/install | bash

          export PATH="$HOME/.opencode/bin:$PATH"

          # Salin system-wide agar tersedia untuk root + runner +
          # terminal Cinnamon via CRD (yang tidak selalu load ~/.bashrc baru).
          sudo cp "$HOME/.opencode/bin/opencode" /usr/local/bin/opencode || true
          sudo chmod +x /usr/local/bin/opencode || true

          echo -e "${C_GREEN}[OK] OpenCode CLI installed: $(opencode --version)${C_NC}"
          echo -e "${C_GREEN}[OK] Binary location: $(which opencode)${C_NC}"


      # ============================================================
      # INSTALL OPENCODE DESKTOP
      # ============================================================
      - name: Install OpenCode Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 07/14] INSTALL OPENCODE DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Downloading OpenCode Desktop (.deb latest)...${C_NC}"
          wget -q https://opencode.ai/download/stable/linux-x64-deb \
            -O /tmp/opencode-desktop.deb

          echo -e "${C_YELLOW}[INFO] Installing .deb package...${C_NC}"
          sudo apt-get install -y /tmp/opencode-desktop.deb

          rm -f /tmp/opencode-desktop.deb

          echo "------------------------------------------------------------"
          dpkg -l | grep -i opencode || true
          ls /usr/share/applications/*opencode* || true
          which opencode-desktop || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] OpenCode Desktop installed.${C_NC}"


      # ============================================================
      # INSTALL CHROME REMOTE DESKTOP
      # ============================================================
      - name: Install Chrome Remote Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 08/14] INSTALL CHROME REMOTE DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Adding Google CRD repository...${C_NC}"

          wget -qO- \
            https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/google-linux.gpg > /dev/null

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome-remote-desktop/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/chrome-remote-desktop.list > /dev/null

          sudo apt-get update

          echo -e "${C_YELLOW}[INFO] Installing chrome-remote-desktop...${C_NC}"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            chrome-remote-desktop

          echo -e "${C_GREEN}[OK] Chrome Remote Desktop installed.${C_NC}"


      # ============================================================
      # CONFIGURE CINNAMON SESSION (CRD HEADLESS, NO LIGHTDM, NO XSESSION WRAPPER)
      # Pelajaran dari error:
      #   "Xsession: unable to launch cinnamon-session-cinnamon ... not found"
      # /etc/X11/Xsession gagal me-resolve nama session di environment
      # runtime CRD -> panggil binary via absolute path langsung.
      # Pola terbukti di Ubuntu 24.04 (xrdp/Hyper-V): exec cinnamon-session.
      # ============================================================
      - name: Configure CRD Cinnamon Session
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 09/14] CONFIGURE CINNAMON SESSION${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Detecting available Cinnamon session...${C_NC}"
          ls /usr/share/xsessions/cinnamon*.desktop || true
          grep -h "^Exec=" /usr/share/xsessions/cinnamon*.desktop || true
          ls -l /usr/bin/cinnamon-session* || true
          ls /usr/share/cinnamon-session/sessions/ || true
          echo -e "${C_YELLOW}[INFO] Diagnostik wrapper Mint (jika ada):${C_NC}"
          cat /usr/bin/cinnamon-session-cinnamon 2>/dev/null || echo "[INFO] no cinnamon-session-cinnamon wrapper"

          echo -e "${C_YELLOW}[INFO] Fail-fast: binary wajib harus ada...${C_NC}"
          test -x /usr/bin/cinnamon-session || { echo -e "${C_RED}[FAIL] /usr/bin/cinnamon-session missing.${C_NC}"; exit 1; }
          command -v cinnamon || { echo -e "${C_RED}[FAIL] binary 'cinnamon' (WM) missing. Cek STEP 02.${C_NC}"; exit 1; }
          test -f /usr/share/cinnamon-session/sessions/cinnamon.session || { echo -e "${C_RED}[FAIL] cinnamon.session missing.${C_NC}"; exit 1; }

          RUNNER_UID=$(id -u runner)
          echo -e "${C_YELLOW}[INFO] runner UID=$RUNNER_UID${C_NC}"
          sudo mkdir -p "/run/user/$RUNNER_UID"
          sudo chown runner:runner "/run/user/$RUNNER_UID"
          sudo chmod 700 "/run/user/$RUNNER_UID"

          echo -e "${C_YELLOW}[INFO] Writing .chrome-remote-desktop-session (direct absolute-path exec)...${C_NC}"
          sudo -u runner tee /home/runner/.chrome-remote-desktop-session > /dev/null <<EOF
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          DESKTOP_SESSION=cinnamon
          XDG_CURRENT_DESKTOP=X-Cinnamon
          XDG_SESSION_TYPE=x11
          XDG_RUNTIME_DIR=/run/user/$RUNNER_UID
          LIBGL_ALWAYS_SOFTWARE=1
          exec /usr/bin/cinnamon-session --session cinnamon
          EOF

          sudo chown runner:runner \
            /home/runner/.chrome-remote-desktop-session

          sudo chmod +x \
            /home/runner/.chrome-remote-desktop-session

          echo "------------------------------------------------------------"
          cat /home/runner/.chrome-remote-desktop-session || true
          echo "------------------------------------------------------------"
          cat -A /home/runner/.chrome-remote-desktop-session || true
          echo "------------------------------------------------------------"
          echo -e "${C_YELLOW}[INFO] Final check: no Xsession/lightdm wrapper allowed...${C_NC}"
          if grep -q "Xsession\|lightdm" /home/runner/.chrome-remote-desktop-session; then
            echo -e "${C_RED}[FAIL] session file masih mengandung Xsession/lightdm.${C_NC}"
            exit 1
          fi

          echo -e "${C_GREEN}[OK] Cinnamon session configured for CRD.${C_NC}"


      # ============================================================
      # DISABLE SCREENSAVER + LOCK (HEADLESS CRD)
      # ============================================================
      - name: Disable Screensaver and Lock
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 10/14] DISABLE SCREENSAVER AND LOCK${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Disabling Cinnamon screensaver persistently (no dbus-launch)...${C_NC}"
          # Hapus autostart screensaver agar tidak mengunci session CRD headless
          sudo rm -f /etc/xdg/autostart/cinnamon-screensaver.desktop || true
          sudo -u runner mkdir -p /home/runner/.config/autostart || true
          sudo -u runner bash -c 'echo "Hidden=true" > /home/runner/.config/autostart/cinnamon-screensaver.desktop' || true
          sudo apt-get remove -y cinnamon-screensaver || true
          # Default dconf system-wide: no idle, no lock
          sudo mkdir -p /etc/dconf/db/local.d || true
          echo -e "[org/cinnamon/desktop/session]\nidle-delay=0\n[org/cinnamon/desktop/screensaver]\nlock-enabled=false\nidle-activation-enabled=false\n[org/gnome/desktop/session]\nidle-delay=0" | sudo tee /etc/dconf/db/local.d/99-crd-no-lock > /dev/null || true
          sudo dconf update || true
          sudo chown -R runner:runner /home/runner/.config || true

          echo -e "${C_GREEN}[OK] Screensaver and lock disabled.${C_NC}"


      # ============================================================
      # CREATE DESKTOP SHORTCUTS
      # ============================================================
      - name: Create Desktop Shortcuts
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 11/14] CREATE DESKTOP SHORTCUTS${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Creating Antigravity shortcut...${C_NC}"
          sudo -u runner bash -c 'cat > /home/runner/Desktop/Antigravity.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Antigravity
          Comment=Open Google Antigravity
          Exec=google-chrome --app=https://antigravity.google/ --no-sandbox
          Icon=google-chrome
          Terminal=false
          EOF'

          echo -e "${C_YELLOW}[INFO] Creating VS Code shortcut...${C_NC}"
          sudo -u runner bash -c 'cat > /home/runner/Desktop/VSCode.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Visual Studio Code
          Comment=Visual Studio Code
          Exec=code
          Icon=code
          Terminal=false
          EOF'

          echo -e "${C_YELLOW}[INFO] Creating Nemo shortcut...${C_NC}"
          sudo -u runner bash -c 'cat > /home/runner/Desktop/Nemo.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Files
          Comment=Cinnamon file manager
          Exec=nemo
          Icon=system-file-manager
          Terminal=false
          EOF'

          echo -e "${C_YELLOW}[INFO] Creating Terminal shortcut...${C_NC}"
          sudo -u runner bash -c 'cat > /home/runner/Desktop/Terminal.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Terminal
          Comment=Terminal emulator
          Exec=gnome-terminal
          Icon=utilities-terminal
          Terminal=false
          EOF'

          # OpenCode Desktop (.deb sudah menyediakan .desktop di
          # /usr/share/applications, tinggal salin ke Desktop).
          # Fallback: buat manual jika file tidak ditemukan.
          echo -e "${C_YELLOW}[INFO] Linking OpenCode shortcut...${C_NC}"
          if ls /usr/share/applications/*opencode*.desktop 1> /dev/null 2>&1; then
            cp /usr/share/applications/*opencode*.desktop /home/runner/Desktop/ || true
          else
            sudo -u runner bash -c 'cat > /home/runner/Desktop/OpenCode.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=OpenCode
          Comment=OpenCode Desktop
          Exec=opencode-desktop
          Icon=opencode-desktop
          Terminal=false
          EOF'
          fi

          sudo chmod +x /home/runner/Desktop/*.desktop

          sudo chown -R runner:runner /home/runner/Desktop

          echo "------------------------------------------------------------"
          ls -l /home/runner/Desktop/*.desktop || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] Desktop shortcuts created.${C_NC}"


      # ============================================================
      # SET CRD PIN
      #
      # Default:
      #   123456
      #
      # Custom:
      #   Create GitHub Actions secret/variable:
      #
      #   CRD_PIN=your-pin
      # ============================================================
      - name: Configure CRD PIN
        env:
          CUSTOM_CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 12/14] CONFIGURE CRD PIN${C_NC}"
          echo "------------------------------------------------------------"

          if [ -n "$CUSTOM_CRD_PIN" ]; then
            CRD_PIN="$CUSTOM_CRD_PIN"
            echo -e "${C_YELLOW}[INFO] Using custom CRD PIN from secret CRD_PIN.${C_NC}"
          else
            CRD_PIN="123456"
            echo -e "${C_YELLOW}[INFO] No CRD_PIN secret found.${C_NC}"
            echo -e "${C_YELLOW}[INFO] Using default PIN: 123456${C_NC}"
          fi

          # Validate PIN
          if ! [[ "$CRD_PIN" =~ ^[0-9]{6,}$ ]]; then
            echo -e "${C_RED}[FAIL] CRD_PIN must contain at least 6 digits.${C_NC}"
            exit 1
          fi

          echo "::add-mask::$CRD_PIN"

          echo "CRD_PIN=$CRD_PIN" >> "$GITHUB_ENV"

          echo -e "${C_GREEN}[OK] CRD PIN configured.${C_NC}"


      # ============================================================
      # REGISTER CHROME REMOTE DESKTOP
      # ============================================================
      - name: Register Chrome Remote Desktop
        env:
          CRD_COMMAND: ${{ inputs.crd_host_command }}
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 13/14] REGISTER CHROME REMOTE DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Validating host command input...${C_NC}"

          if [ -z "$CRD_COMMAND" ]; then
            echo -e "${C_RED}[FAIL] CRD host command is empty.${C_NC}"
            exit 1
          fi

          echo -e "${C_YELLOW}[INFO] Registering host as user 'runner'...${C_NC}"

          # Jalankan command CRD sebagai user runner.
          # PIN akan diberikan melalui environment CRD_PIN.
          sudo -u runner \
            env CRD_PIN="$CRD_PIN" \
            bash -c "$CRD_COMMAND --pin=\"$CRD_PIN\""

          echo ""
          echo "=============================================================="
          echo -e "${C_GREEN}      [OK] CHROME REMOTE DESKTOP READY${C_NC}"
          echo "=============================================================="
          echo -e "      [INFO] Access    : https://remotedesktop.google.com/access"
          echo -e "      [INFO] User      : runner"
          echo -e "      [INFO] Desktop   : Cinnamon"
          echo -e "      [INFO] PIN       : default 123456 (or custom via secret CRD_PIN)"
          echo "=============================================================="
          echo ""
          echo "::notice::CRD ready (Cinnamon) - connect via https://remotedesktop.google.com/access as user runner"


      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify Installation
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 14/14] VERIFY INSTALLATION${C_NC}"
          echo "------------------------------------------------------------"

          echo "::group::[CHECK] System"
          uname -a
          echo "::endgroup::"

          echo "::group::[CHECK] Cinnamon"
          echo -e "[ASSERT] binary 'cinnamon' (WM) wajib ada..."
          command -v cinnamon || { echo "[FAIL] binary 'cinnamon' missing!"; exit 1; }
          cinnamon --version
          muffin --version || true
          nemo --version || true
          ls /usr/share/xsessions/cinnamon.desktop || true
          grep "^Exec=" /usr/share/xsessions/cinnamon.desktop || true
          ls -l /usr/bin/cinnamon-session || true
          test -f /usr/share/cinnamon-session/sessions/cinnamon.session || { echo "[FAIL] cinnamon.session missing!"; exit 1; }
          ls /usr/share/cinnamon-session/sessions/ || true
          echo "--- session file ---"
          cat /home/runner/.chrome-remote-desktop-session || true
          echo "--- session file (cat -A, cek spasi liar) ---"
          cat -A /home/runner/.chrome-remote-desktop-session || true
          ls -l /home/runner/.chrome-remote-desktop-session || true
          echo "--- no Xsession/lightdm wrapper allowed ---"
          grep -r "Xsession\|lightdm" /home/runner/.chrome-remote-desktop-session && echo "[FAIL] session file masih pakai wrapper!" && exit 1 || echo "[OK] session file direct exec, bersih"
          grep -q "exec /usr/bin/cinnamon-session --session cinnamon" /home/runner/.chrome-remote-desktop-session || { echo "[FAIL] exec line tidak sesuai harapan!"; exit 1; }
          echo "::endgroup::"

          echo "::group::[CHECK] Google Chrome"
          google-chrome --version || true
          echo "::endgroup::"

          echo "::group::[CHECK] VS Code"
          code --version || true
          echo "::endgroup::"

          echo "::group::[CHECK] OpenCode CLI"
          opencode --version || true
          which opencode || true
          echo "::endgroup::"

          echo "::group::[CHECK] OpenCode Desktop"
          dpkg -l | grep -i opencode || true
          ls /usr/share/applications/*opencode* || true
          ls /home/runner/Desktop/*pencode*.desktop || true
          echo "::endgroup::"

          echo "::group::[CHECK] Chrome Remote Desktop service"
          systemctl status \
            chrome-remote-desktop@runner.service \
            --no-pager \
            || true
          echo "::endgroup::"

          echo "::group::[CHECK] Remote user"
          id runner
          echo "::endgroup::"

          echo ""
          echo -e "${C_GREEN}[OK] Installation verification completed.${C_NC}"


      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep Alive
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "=============================================================="
          echo -e "${C_GREEN}  [OK] CHROME REMOTE DESKTOP IS RUNNING (CINNAMON)${C_NC}"
          echo "=============================================================="
          echo -e "  ${C_YELLOW}[INFO] Keep-alive 6 jam (sleep 21600). Jangan cancel workflow.${C_NC}"
          echo -e "  [INFO] Access : https://remotedesktop.google.com/access"
          echo -e "  [INFO] User   : runner"
          echo -e "  [INFO] Desktop: Cinnamon"
          echo "=============================================================="

          sleep 21600
