name: RICH LINUX (Cinnamon + Chrome Remote Desktop)

on:
  workflow_dispatch:
    inputs:
      crd_host_command:
        description: "Paste SELURUH command Chrome Remote Desktop dari halaman Remote Access"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Checkout repository (for safe-upgrade helper)
        uses: actions/checkout@v4

      - id: dated
        run: echo "today=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Restore apt package cache (re-run cepat, tak unduh ulang ~GB)
        uses: actions/cache@v4
        with:
          path: /home/runner/apt-archives
          key: apt-ubuntu-2404-${{ steps.dated.outputs.today }}
          restore-keys: |
            apt-ubuntu-2404-
          save-always: true

      # ============================================================
      # PREPARE SYSTEM
      # ============================================================
      - name: Prepare System
        shell: bash
        run: |
          set -e

          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 01/17] PREPARE SYSTEM${C_NC}"
          echo "------------------------------------------------------------"

          __prepare_start=$(date +%s)

          # Prevent interactive package configuration
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=l

          echo -e "${C_YELLOW}[INFO] Disabling needrestart (no noisy logs, no auto-restart)...${C_NC}"
          sudo rm -f /etc/apt/apt.conf.d/99needrestart || true
          sudo rm -f /etc/apt/apt.conf.d/20needrestart || true
          sudo mkdir -p /etc/needrestart/needrestart.conf.d || true
          echo '$nrconf{restart} = '"'"'l'"'"';' | sudo tee /etc/needrestart/needrestart.conf.d/99-no-restart.conf > /dev/null
          echo '$nrconf{kernelhints} = 0;' | sudo tee -a /etc/needrestart/needrestart.conf.d/99-no-restart.conf > /dev/null
          echo '$nrconf{check} = 0;' | sudo tee -a /etc/needrestart/needrestart.conf.d/99-no-restart.conf > /dev/null

          echo -e "${C_YELLOW}[INFO] Tuning apt for speed (retries, timeout, no languages)...${C_NC}"
          sudo tee /etc/apt/apt.conf.d/99-speed > /dev/null <<'APTEOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::Languages "none";
          APTEOF

          echo -e "${C_YELLOW}[INFO] Seeding /var/cache/apt/archives from GitHub apt cache...${C_NC}"
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo cp -a /home/runner/apt-archives/. /var/cache/apt/archives/ 2>/dev/null || true

          echo -e "${C_YELLOW}[INFO] Cleaning APT cache and package lists...${C_NC}"
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo mkdir -p /var/lib/apt/lists/partial

          echo -e "${C_YELLOW}[INFO] Updating APT repositories...${C_NC}"
          APT_UPDATED=false

          for attempt in 1 2 3 4 5; do
            echo -e "${C_CYAN}[INFO] APT update attempt ${attempt}/5...${C_NC}"

            if sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::No-Cache=true \
              -o Acquire::https::No-Cache=true \
              -o Acquire::http::Pipeline-Depth=0 \
              -o Acquire::Languages=none; then

              APT_UPDATED=true
              echo -e "${C_GREEN}[OK] APT repositories updated successfully.${C_NC}"
              break
            fi

            echo -e "${C_YELLOW}[WARN] APT update failed. Cleaning lists before retry...${C_NC}"
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get clean
            sudo mkdir -p /var/lib/apt/lists/partial
            sleep 5
          done

          if [ "$APT_UPDATED" != "true" ]; then
            echo -e "${C_RED}[ERROR] Failed to update APT repositories after 5 attempts.${C_NC}"
            exit 1
          fi

          echo -e "${C_YELLOW}[INFO] Installing required packages...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            ca-certificates \
            curl \
            wget \
            gnupg \
            lsb-release \
            apt-transport-https

          __prepare_end=$(date +%s)
          echo -e "${C_GREEN}[OK] System prepared. (Elapsed: $((__prepare_end-__prepare_start))s)${C_NC}"


      # ============================================================
      # INSTALL CINNAMON DESKTOP (FULL)
      # ============================================================
      - name: Install Cinnamon Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 02/17] INSTALL CINNAMON DESKTOP (FULL)${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Installing full Cinnamon desktop environment...${C_NC}"
          echo -e "${C_YELLOW}[INFO] This downloads approx 1GB, please wait...${C_NC}"

          # Slim font: metapackage fonts-noto merekomendasikan font raksasa
          # (fonts-noto-cjk 61MB, cjk-extra 145MB, extra 78.5MB) yang tidak
          # dibutuhkan desktop. Pin negative membuat apt melewatinya
          # (safe: hanya Recommends, bukan Depends). Pin dihapus lagi setelah
          # install agar install font di sesi CRD nanti tetap normal.
          sudo tee /etc/apt/preferences.d/99-no-noto-heavy > /dev/null <<'PREFE'
          Package: fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-extra
          Pin: version *
          Pin-Priority: -1
          PREFE

          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            cinnamon-desktop-environment \
            cinnamon \
            cinnamon-session \
            dbus-x11 \
            dbus-user-session \
            policykit-1 \
            x11-xserver-utils \
            xorg \
            xserver-xorg-video-dummy \
            mesa-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            adwaita-icon-theme \
            fonts-cantarell \
            nemo \
            obs-studio \
            gnome-terminal

          sudo rm -f /etc/apt/preferences.d/99-no-noto-heavy
          echo -e "${C_GREEN}[OK] Heavy Noto fonts (cjk / cjk-extra / extra) skipped (~285MB saved).${C_NC}"

          echo "------------------------------------------------------------"
          echo -e "${C_YELLOW}[INFO] Verifying Cinnamon binaries (fail-fast)...${C_NC}"
          command -v cinnamon || { echo -e "${C_RED}[FAIL] binary 'cinnamon' not found after install.${C_NC}"; exit 1; }
          test -x /usr/bin/cinnamon-session || { echo -e "${C_RED}[FAIL] /usr/bin/cinnamon-session not found.${C_NC}"; exit 1; }
          cinnamon --version
          muffin --version || true
          nemo --version || true
          ls /usr/share/xsessions/cinnamon.desktop || true
          grep "^Exec=" /usr/share/xsessions/cinnamon.desktop || true
          which cinnamon-session || true
          ls /usr/share/cinnamon-session/sessions/ || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] Cinnamon desktop installed: $(cinnamon --version 2>/dev/null || echo 'version check skipped')${C_NC}"


      # ============================================================
      # CREATE REMOTE USER
      # ============================================================
      - name: Setup Remote User
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 03/17] SETUP REMOTE USER${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Creating user 'runner'...${C_NC}"
          sudo useradd \
            -m \
            -s /bin/bash \
            runner || true

          echo "runner:root" | sudo chpasswd

          sudo usermod -aG sudo runner

          echo -e "${C_YELLOW}[INFO] Setting NEEDRESTART_MODE=l for runner (prevents service restart during apt)...${C_NC}"
          echo 'export NEEDRESTART_MODE=l' | sudo tee -a /home/runner/.bashrc > /dev/null
          echo 'export NEEDRESTART_SUSPEND=1' | sudo tee -a /home/runner/.bashrc > /dev/null

          sudo mkdir -p /home/runner/Desktop

          sudo chown -R runner:runner /home/runner

          echo -e "${C_GREEN}[OK] Remote user 'runner' created: $(id runner)${C_NC}"


      # ============================================================
      # INSTALL GOOGLE CHROME
      # ============================================================
      - name: Install Google Chrome
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 04/17] INSTALL GOOGLE CHROME${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Downloading Google Chrome stable...${C_NC}"
          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            -O /tmp/google-chrome.deb

          echo -e "${C_YELLOW}[INFO] Installing .deb package...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            /tmp/google-chrome.deb

          rm -f /tmp/google-chrome.deb

          echo -e "${C_GREEN}[OK] Google Chrome installed: $(google-chrome --version)${C_NC}"


      # ============================================================
      # INSTALL OPENCODE CLI
      # ============================================================
      - name: Install OpenCode CLI
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 05/17] INSTALL OPENCODE CLI${C_NC}"
          echo "------------------------------------------------------------"

          # NOTE: installer opencode.ai/install mengabaikan
          # OPENCODE_INSTALL_DIR dan selalu install ke $HOME/.opencode/bin.
          # $GITHUB_PATH dari installer hanya berlaku untuk step berikutnya,
          # jadi export PATH manual untuk step yang sama.
          echo -e "${C_YELLOW}[INFO] Running official OpenCode installer...${C_NC}"
          curl -fsSL https://opencode.ai/install | bash

          export PATH="$HOME/.opencode/bin:$PATH"

          # Salin system-wide agar tersedia untuk root + runner +
          # terminal Cinnamon via CRD (yang tidak selalu load ~/.bashrc baru).
          sudo cp "$HOME/.opencode/bin/opencode" /usr/local/bin/opencode || true
          sudo chmod +x /usr/local/bin/opencode || true

          echo -e "${C_GREEN}[OK] OpenCode CLI installed: $(opencode --version)${C_NC}"
          echo -e "${C_GREEN}[OK] Binary location: $(which opencode)${C_NC}"


      # ============================================================
      # INSTALL OPENCODE DESKTOP
      # ============================================================
      - name: Install OpenCode Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 06/17] INSTALL OPENCODE DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Downloading OpenCode Desktop (.deb latest)...${C_NC}"
          wget -q https://opencode.ai/download/stable/linux-x64-deb \
            -O /tmp/opencode-desktop.deb

          echo -e "${C_YELLOW}[INFO] Installing .deb package...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            /tmp/opencode-desktop.deb

          rm -f /tmp/opencode-desktop.deb

          echo "------------------------------------------------------------"
          dpkg -l | grep -i opencode || true
          ls /usr/share/applications/*opencode* || true
          which opencode-desktop || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] OpenCode Desktop installed.${C_NC}"


      # ============================================================
      # INSTALL CHROME REMOTE DESKTOP
      # ============================================================
      - name: Install Chrome Remote Desktop
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 07/17] INSTALL CHROME REMOTE DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Adding Google CRD repository...${C_NC}"

          wget -qO- \
            https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/google-linux.gpg > /dev/null

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome-remote-desktop/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/chrome-remote-desktop.list > /dev/null

          sudo apt-get update

          echo -e "${C_YELLOW}[INFO] Installing chrome-remote-desktop...${C_NC}"
          sudo NEEDRESTART_MODE=l DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            chrome-remote-desktop

          echo -e "${C_GREEN}[OK] Chrome Remote Desktop installed.${C_NC}"

      # Simpan arsip .deb ke cache GitHub SEKARANG (sebelum register) —
      # kalau STEP 15 gagal & user re-run, install tidak perlu unduh ulang.
      - name: Sync apt cache for GitHub save
        run: |
          sudo mkdir -p /home/runner/apt-archives
          sudo cp -a /var/cache/apt/archives/. /home/runner/apt-archives/ || true
          sudo chown -R runner:runner /home/runner/apt-archives || true

      # ============================================================
      # CONFIGURE CINNAMON SESSION (CRD HEADLESS, NO LIGHTDM, NO XSESSION WRAPPER)
      # Pelajaran dari error:
      #   "Xsession: unable to launch cinnamon-session-cinnamon ... not found"
      # /etc/X11/Xsession gagal me-resolve nama session di environment
      # runtime CRD -> panggil binary via absolute path langsung.
      # Pola terbukti di Ubuntu 24.04 (xrdp/Hyper-V): exec cinnamon-session.
      # ============================================================
      - name: Configure CRD Cinnamon Session
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 08/17] CONFIGURE CINNAMON SESSION${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Detecting available Cinnamon session...${C_NC}"
          ls /usr/share/xsessions/cinnamon*.desktop || true
          grep -h "^Exec=" /usr/share/xsessions/cinnamon*.desktop || true
          ls -l /usr/bin/cinnamon-session* || true
          ls /usr/share/cinnamon-session/sessions/ || true
          echo -e "${C_YELLOW}[INFO] Diagnostik wrapper Mint (jika ada):${C_NC}"
          cat /usr/bin/cinnamon-session-cinnamon 2>/dev/null || echo "[INFO] no cinnamon-session-cinnamon wrapper"

          echo -e "${C_YELLOW}[INFO] Fail-fast: binary wajib harus ada...${C_NC}"
          test -x /usr/bin/cinnamon-session || { echo -e "${C_RED}[FAIL] /usr/bin/cinnamon-session missing.${C_NC}"; exit 1; }
          command -v cinnamon || { echo -e "${C_RED}[FAIL] binary 'cinnamon' (WM) missing. Cek STEP 02.${C_NC}"; exit 1; }
          test -f /usr/share/cinnamon-session/sessions/cinnamon.session || { echo -e "${C_RED}[FAIL] cinnamon.session missing.${C_NC}"; exit 1; }

          RUNNER_UID=$(id -u runner)
          echo -e "${C_YELLOW}[INFO] runner UID=$RUNNER_UID${C_NC}"
          sudo mkdir -p "/run/user/$RUNNER_UID"
          sudo chown runner:runner "/run/user/$RUNNER_UID"
          sudo chmod 700 "/run/user/$RUNNER_UID"

          echo -e "${C_YELLOW}[INFO] Creating Xorg dummy display config (1600x1200)...${C_NC}"
          sudo mkdir -p /etc/X11/xorg.conf.d
          sudo tee /etc/X11/xorg.conf.d/10-dummy.conf > /dev/null <<'XORGEOF'
          Section "Device"
              Identifier  "Configured Video Device"
              Driver      "dummy"
              VideoRam    256000
          EndSection

          Section "Monitor"
              Identifier  "Configured Monitor"
              HorizSync   28.0-80.0
              VertRefresh 48.0-75.0
              Modeline    "1600x1200" 129.00 1600 1664 1856 2160 1200 1201 1204 1250 +HSync +VSync
          EndSection

          Section "Screen"
              Identifier  "Default Screen"
              Monitor     "Configured Monitor"
              Device      "Configured Video Device"
              DefaultDepth 24
              SubSection "Display"
                  Depth   24
                  Modes   "1600x1200"
              EndSubSection
          EndSection
          XORGEOF

          echo -e "${C_YELLOW}[INFO] Writing .chrome-remote-desktop-session (direct absolute-path exec + xrandr)...${C_NC}"
          sudo -u runner tee /home/runner/.chrome-remote-desktop-session > /dev/null <<EOF
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export NEEDRESTART_MODE=l
          DESKTOP_SESSION=cinnamon
          XDG_CURRENT_DESKTOP=X-Cinnamon
          XDG_SESSION_TYPE=x11
          XDG_RUNTIME_DIR=/run/user/$RUNNER_UID
          LIBGL_ALWAYS_SOFTWARE=1

          # Auto-detect display and set 1600x1200 resolution.
          # CRD selalu start Xorg di display >= 20 (FIRST_X_DISPLAY_NUMBER=20) dan
          # sudah export DISPLAY+XAUTHORITY ke session -> pakai \$DISPLAY,
          # bukan probe :0..:N. Dummy driver mengadvertise mode '1600x1200_60'.
          sleep 2
          OUTPUT=""
          for DISPLAY_NUM in "\$DISPLAY" :20 :21 :22 :0; do
            OUTPUT=\$(xrandr --display "\$DISPLAY_NUM" 2>/dev/null | grep " connected" | awk '{print \$1}' | head -n1)
            [ -n "\$OUTPUT" ] && break
          done
          if [ -n "\$OUTPUT" ]; then
            MODE=\$(xrandr --display "\$DISPLAY" 2>/dev/null | grep -oE "1600x1200(_[0-9.]+)?" | head -n1)
            if [ -z "\$MODE" ]; then
              xrandr --display "\$DISPLAY" --newmode "1600x1200" 129.00 1600 1664 1856 2160 1200 1201 1204 1250 +HSync +VSync 2>/dev/null || true
              xrandr --display "\$DISPLAY" --addmode "\$OUTPUT" 1600x1200 2>/dev/null || true
              MODE=1600x1200
            fi
            xrandr --display "\$DISPLAY" --output "\$OUTPUT" --mode "\$MODE" 2>/dev/null || true
          fi

          exec /usr/bin/cinnamon-session --session cinnamon
          EOF

          sudo chown runner:runner \
            /home/runner/.chrome-remote-desktop-session

          sudo chmod +x \
            /home/runner/.chrome-remote-desktop-session

          echo -e "${C_YELLOW}[INFO] Creating autostart fallback (re-apply 1600x1200 ~5s after desktop starts)...${C_NC}"
          sudo -u runner mkdir -p /home/runner/.config/autostart
          sudo -u runner tee /home/runner/.config/autostart/set-resolution.desktop > /dev/null <<EOF
          [Desktop Entry]
          Type=Application
          Name=Set Resolution
          Exec=sh -c "sleep 5; for o in \$(xrandr 2>/dev/null | grep -E \" connected\" | cut -d\" \" -f1); do xrandr --output \"\$o\" --mode 1600x1200_60 2>/dev/null || true; done"
          X-GNOME-Autostart-enabled=true
          Terminal=false
          EOF

          echo "------------------------------------------------------------"
          cat /home/runner/.chrome-remote-desktop-session || true
          echo "------------------------------------------------------------"
          cat -A /home/runner/.chrome-remote-desktop-session || true
          echo "------------------------------------------------------------"
          echo -e "${C_YELLOW}[INFO] Final check: no Xsession/lightdm wrapper allowed...${C_NC}"
          if grep -q "Xsession\|lightdm" /home/runner/.chrome-remote-desktop-session; then
            echo -e "${C_RED}[FAIL] session file masih mengandung Xsession/lightdm.${C_NC}"
            exit 1
          fi

          echo -e "${C_GREEN}[OK] Cinnamon session configured for CRD.${C_NC}"


      # ============================================================
      # DISABLE SCREENSAVER + LOCK (HEADLESS CRD)
      # ============================================================
      - name: Disable Screensaver and Lock
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 09/17] DISABLE SCREENSAVER AND LOCK${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Disabling Cinnamon screensaver persistently (no dbus-launch)...${C_NC}"
          echo -e "${C_YELLOW}[INFO] NOTE: jangan apt-get remove cinnamon-screensaver - itu ikut mencopot paket 'cinnamon' (dependency). Disable saja.${C_NC}"
          # Non-destruktif: cegah autostart screensaver agar tidak mengunci session CRD headless.
          # (Paketnya tetap terinstall supaya dependency 'cinnamon' tidak ikut terhapus.)
          sudo rm -f /etc/xdg/autostart/cinnamon-screensaver.desktop || true
          sudo -u runner mkdir -p /home/runner/.config/autostart || true
          sudo -u runner bash -c 'echo "Hidden=true" > /home/runner/.config/autostart/cinnamon-screensaver.desktop' || true
          # Default dconf system-wide: no idle, no lock
          sudo mkdir -p /etc/dconf/db/local.d || true
          echo -e "[org/cinnamon/desktop/session]\nidle-delay=0\n[org/cinnamon/desktop/screensaver]\nlock-enabled=false\nidle-activation-enabled=false\n[org/gnome/desktop/session]\nidle-delay=0" | sudo tee /etc/dconf/db/local.d/99-crd-no-lock > /dev/null || true
          sudo dconf update || true
          sudo chown -R runner:runner /home/runner/.config || true

          echo -e "${C_YELLOW}[INFO] Guard: pastikan paket 'cinnamon' masih utuh setelah disable...${C_NC}"
          command -v cinnamon || { echo -e "${C_RED}[FAIL] binary 'cinnamon' hilang setelah STEP 10!${C_NC}"; exit 1; }
          test -x /usr/bin/cinnamon-session || { echo -e "${C_RED}[FAIL] /usr/bin/cinnamon-session hilang setelah STEP 10!${C_NC}"; exit 1; }

          echo -e "${C_GREEN}[OK] Screensaver and lock disabled.${C_NC}"


      # ============================================================
      # INSTALL SAFE-UPGRADE HELPER
      # Pengganti `sudo apt upgrade` manual yang memutus sesi CRD.
      # ============================================================
      - name: Install Safe Upgrade Helper
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 10/17] INSTALL SAFE-UPGRADE HELPER${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Copying repo scripts/safe-upgrade.sh...${C_NC}"
          if [ ! -f "$GITHUB_WORKSPACE/scripts/safe-upgrade.sh" ]; then
            echo -e "${C_RED}[FAIL] scripts/safe-upgrade.sh tidak ditemukan (checkout gagal).${C_NC}"
            exit 1
          fi
          sudo cp "$GITHUB_WORKSPACE/scripts/safe-upgrade.sh" /usr/local/bin/safe-upgrade
          sudo chmod +x /usr/local/bin/safe-upgrade || true
          sudo ln -sf /usr/local/bin/safe-upgrade /usr/bin/safe-upgrade || true

          echo 'JANGAN jalankan `sudo apt upgrade -y` polos di sesi CRD (memutus koneksi). Pakai: safe-upgrade' \
            | sudo tee /etc/motd > /dev/null || true

          echo "------------------------------------------------------------"
          ls -l /usr/local/bin/safe-upgrade || true
          safe-upgrade --help || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] safe-upgrade installed. Gunakan \`safe-upgrade\` pengganti \`apt upgrade\`.${C_NC}"


      # ============================================================
      # INSTALL CATPPUCCIN THEME & ZAFIRO ICONS
      # Extract cinnamon-theme.zip → /usr/share/themes + /usr/share/icons
      # Apply via dconf system-wide + per-user fallback + autostart
      # ============================================================
      - name: Install Catppuccin Theme & Zafiro Icons
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 11/17] INSTALL CATPPUCCIN THEME & ZAFIRO ICONS${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Extracting cinnamon-theme.zip to /usr/share/...${C_NC}"
          if [ ! -f "$GITHUB_WORKSPACE/assets/cinnamon-theme.zip" ]; then
            echo -e "${C_RED}[FAIL] assets/cinnamon-theme.zip tidak ditemukan (checkout gagal).${C_NC}"
            exit 1
          fi
          sudo unzip -o "$GITHUB_WORKSPACE/assets/cinnamon-theme.zip" \
            -d /usr/share/ \
            "themes/*" "icons/*"

          echo -e "${C_YELLOW}[INFO] Verifying extracted files...${C_NC}"
          test -d /usr/share/themes/Catppuccin-B-LB-Dark || { echo -e "${C_RED}[FAIL] Theme directory not found.${C_NC}"; exit 1; }
          test -d /usr/share/icons/Zafiro-Nord-Black || { echo -e "${C_RED}[FAIL] Icons directory not found.${C_NC}"; exit 1; }
          ls /usr/share/themes/Catppuccin-B-LB-Dark/index.theme || true
          ls /usr/share/icons/Zafiro-Nord-Black/index.theme || true

          echo -e "${C_YELLOW}[INFO] Applying theme via dconf system-wide...${C_NC}"
          sudo mkdir -p /etc/dconf/db/local.d
          sudo tee /etc/dconf/db/local.d/01-theme > /dev/null <<'DCONFEOF'
          [org/cinnamon/desktop/interface]
          gtk-theme='Catppuccin-B-LB-Dark'
          icon-theme='Zafiro-Nord-Black'

          [org/cinnamon/theme]
          name='Catppuccin-B-LB-Dark'
          DCONFEOF
          sudo dconf update || true

          echo -e "${C_YELLOW}[INFO] Applying theme per-user (fallback via dbus-run-session)...${C_NC}"
          sudo -u runner dbus-run-session -- gsettings set org.cinnamon.desktop.interface gtk-theme 'Catppuccin-B-LB-Dark' || true
          sudo -u runner dbus-run-session -- gsettings set org.cinnamon.desktop.interface icon-theme 'Zafiro-Nord-Black' || true
          sudo -u runner dbus-run-session -- gsettings set org.cinnamon.theme name 'Catppuccin-B-LB-Dark' || true

          echo -e "${C_YELLOW}[INFO] Creating autostart fallback for theme persistence...${C_NC}"
          sudo -u runner mkdir -p /home/runner/.config/autostart
          sudo -u runner bash -c 'cat > /home/runner/.config/autostart/set-theme.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Set Theme
          Exec=sh -c "sleep 3; gsettings set org.cinnamon.desktop.interface gtk-theme \"Catppuccin-B-LB-Dark\"; gsettings set org.cinnamon.desktop.interface icon-theme \"Zafiro-Nord-Black\"; gsettings set org.cinnamon.theme name \"Catppuccin-B-LB-Dark\""
          X-GNOME-Autostart-enabled=true
          Terminal=false
          EOF'

          echo "------------------------------------------------------------"
          ls -d /usr/share/themes/Catppuccin-B-LB-Dark/ || true
          ls -d /usr/share/icons/Zafiro-Nord-Black/ || true
          echo "------------------------------------------------------------"
          echo -e "${C_GREEN}[OK] Catppuccin-B-LB-Dark theme + Zafiro-Nord-Black icons installed.${C_NC}"


      # ============================================================
      # SET WALLPAPER (BLACK UNICAT / CATPPUCCIN)
      # ============================================================
      - name: Set Wallpaper
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 12/17] SET WALLPAPER${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Downloading Catppuccin 'black unicat' wallpaper...${C_NC}"
          sudo -u runner mkdir -p /home/runner/Pictures
          sudo -u runner wget -q -O /home/runner/Pictures/wallpaper.png \
            "https://raw.githubusercontent.com/zhichaoh/catppuccin-wallpapers/refs/heads/main/minimalistic/black5_unicat.png" \
            || { echo -e "${C_RED}[FAIL] Gagal mengunduh wallpaper.${C_NC}"; exit 1; }
          sudo chown runner:runner /home/runner/Pictures/wallpaper.png

          echo -e "${C_YELLOW}[INFO] Setting wallpaper via gsettings (Cinnamon schema)...${C_NC}"
          # dbus-run-session menyediakan session dbus sementara agar gsettings
          # menulis ke dconf user 'runner', yang dipakai saat CRD session menyala.
          sudo -u runner dbus-run-session -- gsettings set org.cinnamon.desktop.background picture-uri "file:///home/runner/Pictures/wallpaper.png" || true
          sudo -u runner dbus-run-session -- gsettings set org.cinnamon.desktop.background picture-options "zoom" || true

          # Fallback autostart: set ulang wallpaper saat session mulai,
          # meng-cover kasus dconf belum tercatat sebelum desktop jalan.
          sudo -u runner mkdir -p /home/runner/.config/autostart
          sudo -u runner bash -c 'cat > /home/runner/.config/autostart/set-wallpaper.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Set Wallpaper
          Exec=sh -c "sleep 3; gsettings set org.cinnamon.desktop.background picture-uri file:///home/runner/Pictures/wallpaper.png; gsettings set org.cinnamon.desktop.background picture-options zoom"
          X-GNOME-Autostart-enabled=true
          Terminal=false
          EOF'

          echo "------------------------------------------------------------"
          ls -l /home/runner/Pictures/wallpaper.png || true
          sudo -u runner file /home/runner/Pictures/wallpaper.png || true
          echo "------------------------------------------------------------"

          echo -e "${C_GREEN}[OK] Wallpaper installed and set for runner.${C_NC}"


      # ============================================================
      # SET CRD PIN
      #
      # Default:
      #   123456
      #
      # Custom:
      #   Create GitHub Actions secret/variable:
      #
      #   CRD_PIN=your-pin
      # ============================================================
      - name: Configure CRD PIN
        env:
          CUSTOM_CRD_PIN: ${{ secrets.CRD_PIN }}
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 13/17] CONFIGURE CRD PIN${C_NC}"
          echo "------------------------------------------------------------"

          if [ -n "$CUSTOM_CRD_PIN" ]; then
            CRD_PIN="$CUSTOM_CRD_PIN"
            echo -e "${C_YELLOW}[INFO] Using custom CRD PIN from secret CRD_PIN.${C_NC}"
          else
            CRD_PIN="123456"
            echo -e "${C_YELLOW}[INFO] No CRD_PIN secret found.${C_NC}"
            echo -e "${C_YELLOW}[INFO] Using default PIN: 123456${C_NC}"
          fi

          # Validate PIN
          if ! [[ "$CRD_PIN" =~ ^[0-9]{6,}$ ]]; then
            echo -e "${C_RED}[FAIL] CRD_PIN must contain at least 6 digits.${C_NC}"
            exit 1
          fi

          echo "::add-mask::$CRD_PIN"

          echo "CRD_PIN=$CRD_PIN" >> "$GITHUB_ENV"

          echo -e "${C_GREEN}[OK] CRD PIN configured.${C_NC}"


      # ============================================================
      # REGISTER CHROME REMOTE DESKTOP
      # ============================================================
      - name: Register Chrome Remote Desktop
        env:
          CRD_COMMAND: ${{ inputs.crd_host_command }}
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_RED='\033[1;31m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 14/17] REGISTER CHROME REMOTE DESKTOP${C_NC}"
          echo "------------------------------------------------------------"

          echo -e "${C_YELLOW}[INFO] Validating host command input...${C_NC}"

          # Bersihkan input: hapus CR/LF ekstra + spasi trailing.
          CRD_COMMAND_CLEAN="$(printf '%s' "$CRD_COMMAND" | tr -d '\r' | sed 's/[[:space:]]*$//')"

          if [ -z "$CRD_COMMAND_CLEAN" ]; then
            echo -e "${C_RED}[FAIL] CRD host command is empty.${C_NC}"
            exit 1
          fi
          if ! printf '%s' "$CRD_COMMAND_CLEAN" | grep -q 'start-host'; then
            echo -e "${C_RED}[FAIL] Input tidak mengandung 'start-host'.${C_NC}"
            echo -e "${C_RED}       Salin SELURUH perintah Debian Linux dari https://remotedesktop.google.com/headless${C_NC}"
            exit 1
          fi
          if printf '%s' "$CRD_COMMAND_CLEAN" | grep -q -- '--pin'; then
            echo -e "${C_YELLOW}[WARN] Input sudah mengandung --pin; nilai dari secret/default akan dipakai.${C_NC}"
          fi
          echo -e "${C_YELLOW}[INFO] CRD command valid ($(printf '%s' "$CRD_COMMAND_CLEAN" | wc -c) chars, contains start-host).${C_NC}"

          echo -e "${C_YELLOW}[INFO] Registering host as user 'runner' (retry 3x jika OAuth transien)...${C_NC}"

          # Jalankan command CRD sebagai user runner.
          # PIN diberikan melalui environment CRD_PIN.
          # Retry + backoff: auth code Google single-use mudah gagal karena
          # kadaluarsa/terpakai/transien — terapkan retry sebelum menyerah.
          rc=1
          attempt=0
          while [ "$attempt" -lt 3 ]; do
            attempt=$((attempt + 1))
            echo -e "${C_YELLOW}[INFO] Registration attempt ${attempt}/3 ...${C_NC}"
            if sudo -u runner \
              env CRD_PIN="$CRD_PIN" \
              bash -c "$CRD_COMMAND_CLEAN --pin=\"$CRD_PIN\""; then
              rc=0
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo -e "${C_YELLOW}[WARN] Registration gagal (mungkin kode single-use kadaluarsa/terpakai, atau error transien). Retry dalam $((attempt * 15))s...${C_NC}"
              sleep $((attempt * 15))
            fi
          done

          if [ "$rc" -ne 0 ]; then
            echo ""
            echo -e "${C_RED}[FAIL] Registrasi Chrome Remote Desktop gagal (OAuth error).${C_NC}"
            echo -e "${C_RED}  Penyebab paling umum: kode auth Google single-use sudah kadaluarsa/terpakai.${C_NC}"
            echo -e "${C_RED}  Pulih TANPA menunggu install ulang (apt sudah tercache, re-run cepat):${C_NC}"
            echo -e "${C_RED}  1) Buka https://remotedesktop.google.com/headless${C_NC}"
            echo -e "${C_RED}  2) Begin -> Next -> Authorize sampai muncul perintah baru.${C_NC}"
            echo -e "${C_RED}  3) Salin perintah Debian Linux versi BARU, lalu Re-run workflow ini.${C_NC}"
            exit 1
          fi

          echo ""
          echo "=============================================================="
          echo -e "${C_GREEN}      [OK] CHROME REMOTE DESKTOP READY${C_NC}"
          echo "=============================================================="
          echo -e "      [INFO] Access    : https://remotedesktop.google.com/access"
          echo -e "      [INFO] User      : runner"
          echo -e "      [INFO] Desktop   : Cinnamon"
          echo -e "      [INFO] PIN       : default 123456 (or custom via secret CRD_PIN)"
          echo "=============================================================="
          echo ""
          echo "::notice::CRD ready (Cinnamon) - connect via https://remotedesktop.google.com/access as user runner"


      # ============================================================
      # VERIFY
      # ============================================================
      - name: Verify Installation
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_NC='\033[0m'

          echo ""
          echo "------------------------------------------------------------"
          echo -e "${C_CYAN}[STEP 15/17] VERIFY INSTALLATION${C_NC}"
          echo "------------------------------------------------------------"

          echo "::group::[CHECK] System"
          uname -a
          echo "::endgroup::"

          echo "::group::[CHECK] Cinnamon"
          echo -e "[ASSERT] binary 'cinnamon' (WM) wajib ada..."
          command -v cinnamon || { echo "[FAIL] binary 'cinnamon' missing!"; exit 1; }
          cinnamon --version
          muffin --version || true
          nemo --version || true
          ls /usr/share/xsessions/cinnamon.desktop || true
          grep "^Exec=" /usr/share/xsessions/cinnamon.desktop || true
          ls -l /usr/bin/cinnamon-session || true
          test -f /usr/share/cinnamon-session/sessions/cinnamon.session || { echo "[FAIL] cinnamon.session missing!"; exit 1; }
          ls /usr/share/cinnamon-session/sessions/ || true
          echo "--- session file ---"
          cat /home/runner/.chrome-remote-desktop-session || true
          echo "--- session file (cat -A, cek spasi liar) ---"
          cat -A /home/runner/.chrome-remote-desktop-session || true
          ls -l /home/runner/.chrome-remote-desktop-session || true
          echo "--- no Xsession/lightdm wrapper allowed ---"
          grep -r "Xsession\|lightdm" /home/runner/.chrome-remote-desktop-session && echo "[FAIL] session file masih pakai wrapper!" && exit 1 || echo "[OK] session file direct exec, bersih"
          grep -q "exec /usr/bin/cinnamon-session --session cinnamon" /home/runner/.chrome-remote-desktop-session || { echo "[FAIL] exec line tidak sesuai harapan!"; exit 1; }
          echo "::endgroup::"

          echo "::group::[CHECK] Google Chrome"
          google-chrome --version || true
          echo "::endgroup::"

          echo "::group::[CHECK] OpenCode CLI"
          opencode --version || true
          which opencode || true
          echo "::endgroup::"

          echo "::group::[CHECK] OpenCode Desktop"
          dpkg -l | grep -i opencode || true
          ls /usr/share/applications/*opencode* || true
          echo "::endgroup::"

          echo "::group::[CHECK] safe-upgrade helper"
          which safe-upgrade || true
          ls -l /usr/local/bin/safe-upgrade || true
          safe-upgrade --help || true
          echo "::endgroup::"

          echo "::group::[CHECK] Catppuccin Theme & Zafiro Icons"
          ls -d /usr/share/themes/Catppuccin-B-LB-Dark/ || true
          ls /usr/share/themes/Catppuccin-B-LB-Dark/index.theme || true
          ls -d /usr/share/icons/Zafiro-Nord-Black/ || true
          ls /usr/share/icons/Zafiro-Nord-Black/index.theme || true
          cat /etc/dconf/db/local.d/01-theme || true
          echo "::endgroup::"

          echo "::group::[CHECK] Resolution config (Xorg dummy)"
          cat /etc/X11/xorg.conf.d/10-dummy.conf || true
          echo "::endgroup::"

          echo "::group::[CHECK] Chrome Remote Desktop service"
          systemctl status \
            chrome-remote-desktop@runner.service \
            --no-pager \
            || true
          echo "::endgroup::"

          echo "::group::[CHECK] Remote user"
          id runner
          echo "::endgroup::"

          echo ""
          echo -e "${C_GREEN}[OK] Installation verification completed.${C_NC}"


      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep Alive
        run: |
          C_CYAN='\033[1;36m'; C_GREEN='\033[1;32m'; C_YELLOW='\033[1;33m'; C_NC='\033[0m'

          echo ""
          echo "=============================================================="
          echo -e "${C_GREEN}  [OK] CHROME REMOTE DESKTOP IS RUNNING (CINNAMON)${C_NC}"
          echo "=============================================================="
          echo -e "  ${C_YELLOW}[INFO] Keep-alive 6 jam (sleep 21600). Jangan cancel workflow.${C_NC}"
          echo -e "  [INFO] Access : https://remotedesktop.google.com/access"
          echo -e "  [INFO] User   : runner"
          echo -e "  [INFO] Pass   : root"
          echo -e "  [INFO] Desktop: Cinnamon"
          echo "=============================================================="

          sleep 21600
