<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="RICH Linux CRD architecture diagram">
  <title>RICH Linux CRD — Architecture</title>
  <desc>User pastes CRD host command into GitHub Actions, runner installs desktop and tools, registers Chrome Remote Desktop host, user connects from browser.</desc>

  <style>
    .card   { fill: #ffffff; stroke: #d0d7de; }
    .box    { fill: #f6f8fa; stroke: #24292f; }
    .box-hi { fill: #ddf4ff; stroke: #0969da; }
    .foot   { fill: #f6f8fa; stroke: #d0d7de; }
    .t-title { fill: #1f2328; }
    .t-sub   { fill: #57606a; }
    .t-step  { fill: #0969da; }
    .t-head  { fill: #1f2328; }
    .t-body  { fill: #24292f; }
    .t-mute  { fill: #57606a; }
    .t-mono  { fill: #24292f; }
    .ln { stroke: #57606a; }
    .ah { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .card   { fill: #161b22; stroke: #30363d; }
      .box    { fill: #0d1117; stroke: #8b949e; }
      .box-hi { fill: #0f2a43; stroke: #4493f8; }
      .foot   { fill: #0d1117; stroke: #30363d; }
      .t-title { fill: #e6edf3; }
      .t-sub   { fill: #9198a1; }
      .t-step  { fill: #4493f8; }
      .t-head  { fill: #e6edf3; }
      .t-body  { fill: #e6edf3; }
      .t-mute  { fill: #9198a1; }
      .t-mono  { fill: #e6edf3; }
      .ln { stroke: #8b949e; }
      .ah { fill: #8b949e; }
    }
  </style>

  <!-- Card background: every text sits on a filled shape, so contrast
       holds on both GitHub light and dark themes -->
  <rect x="16" y="12" width="1168" height="324" rx="16" class="card" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="52" font-size="22" font-weight="700" class="t-title">RICH Linux CRD — Architecture</text>
  <text x="40" y="74" font-size="13" class="t-sub">Ubuntu 24.04 on GitHub Actions + Chrome Remote Desktop (headless X11, no LightDM)</text>

  <!-- Steps -->
  <g font-size="13">
    <!-- Step 1 -->
    <rect x="40" y="104" width="200" height="140" rx="10" class="box" stroke-width="1.5"/>
    <text x="56" y="130" font-size="11" font-weight="700" class="t-step">1 — INPUT</text>
    <text x="56" y="152" font-size="14" font-weight="700" class="t-head">User input</text>
    <text x="56" y="172" class="t-body">CRD host command</text>
    <text x="56" y="192" class="t-body">from headless setup</text>
    <text x="56" y="212" class="t-mute">+ PIN (default 123456</text>
    <text x="56" y="230" class="t-mute">or CRD_PIN secret)</text>

    <line x1="242" y1="174" x2="262" y2="174" class="ln" stroke-width="2"/>
    <polygon points="262,168 262,180 272,174" class="ah"/>

    <!-- Step 2 -->
    <rect x="272" y="104" width="200" height="140" rx="10" class="box" stroke-width="1.5"/>
    <text x="288" y="130" font-size="11" font-weight="700" class="t-step">2 — RUNNER</text>
    <text x="288" y="152" font-size="14" font-weight="700" class="t-head">GitHub Actions</text>
    <text x="288" y="172" class="t-body">ubuntu-24.04 runner</text>
    <text x="288" y="192" class="t-body">prepare system</text>
    <text x="288" y="212" class="t-mute">full upgrade at</text>
    <text x="288" y="230" class="t-mute">build time (safe)</text>

    <line x1="474" y1="174" x2="494" y2="174" class="ln" stroke-width="2"/>
    <polygon points="494,168 494,180 504,174" class="ah"/>

    <!-- Step 3 -->
    <rect x="504" y="104" width="216" height="140" rx="10" class="box" stroke-width="1.5"/>
    <text x="520" y="130" font-size="11" font-weight="700" class="t-step">3 — INSTALL</text>
    <text x="520" y="152" font-size="14" font-weight="700" class="t-head">Desktop + tools</text>
    <text x="520" y="172" class="t-body">Cinnamon or GNOME</text>
    <text x="520" y="192" class="t-body">Chrome, VS Code,</text>
    <text x="520" y="212" class="t-body">OpenCode, CRD</text>
    <text x="520" y="230" class="t-mute">safe-upgrade helper</text>

    <line x1="722" y1="174" x2="742" y2="174" class="ln" stroke-width="2"/>
    <polygon points="742,168 742,180 752,174" class="ah"/>

    <!-- Step 4 -->
    <rect x="752" y="104" width="200" height="140" rx="10" class="box" stroke-width="1.5"/>
    <text x="768" y="130" font-size="11" font-weight="700" class="t-step">4 — REGISTER</text>
    <text x="768" y="152" font-size="14" font-weight="700" class="t-head">CRD host</text>
    <text x="768" y="172" class="t-body">direct exec session</text>
    <text x="768" y="192" class="t-body">software rendering</text>
    <text x="768" y="212" class="t-mute">no Xsession wrapper</text>
    <text x="768" y="230" class="t-mute">lock/suspend off</text>

    <line x1="954" y1="174" x2="974" y2="174" class="ln" stroke-width="2"/>
    <polygon points="974,168 974,180 984,174" class="ah"/>

    <!-- Step 5 -->
    <rect x="984" y="104" width="176" height="140" rx="10" class="box-hi" stroke-width="1.5"/>
    <text x="1000" y="130" font-size="11" font-weight="700" class="t-step">5 — CONNECT</text>
    <text x="1000" y="152" font-size="14" font-weight="700" class="t-head">Browser</text>
    <text x="1000" y="172" class="t-body">remotedesktop.</text>
    <text x="1000" y="192" class="t-body">google.com/access</text>
    <text x="1000" y="212" class="t-mute">enter PIN,</text>
    <text x="1000" y="230" class="t-mute">6-hour session</text>
  </g>

  <!-- Footer callout -->
  <rect x="40" y="258" width="1120" height="46" rx="10" class="foot" stroke-width="1"/>
  <g font-size="12">
    <text x="64" y="286" class="t-mute">In-session upgrades use the </text>
    <text x="228" y="286" font-weight="700" class="t-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">safe-upgrade</text>
    <text x="318" y="286" class="t-mute"> helper — never run plain </text>
    <text x="477" y="286" font-weight="700" class="t-mono" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sudo apt upgrade -y</text>
    <text x="614" y="286" class="t-mute"> inside the CRD session (restarts CRD/desktop/systemd, drops the connection).</text>
  </g>
</svg>
